[project]
name = "ai4music-workspace"
version = "0.9.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  # Optional local ASR dependencies for source builds.
  "faster-whisper==1.2.1",
  "av==18.1.0",
  "ctranslate2==4.8.4",
  "transformers==5.13.0",
  "safetensors==0.8.0",
  "mypy==2.4.0",
  "pyinstaller>=6,<7",
  "ruff==0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.uv.workspace]
members = ["packages/*", "services/*"]
